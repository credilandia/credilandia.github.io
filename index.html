<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Credilandia</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background-color: #f8f6f3;
    text-align: center;
}

.banner {
    width: 100%;
}

/* BOTONES BONITOS */
.categorias {
    margin: 20px;
}

.categorias button {
    margin: 8px;
    padding: 12px 18px;
    background: linear-gradient(135deg, #d4af37, #b48a5a);
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

.categorias button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

/* GRID */
.contenedor-productos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 20px;
}

/* PRODUCTO */
.producto {
    background: white;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

.producto img {
    width: 100%;
}

/* STOCK */
.disponible { color: green; }
.poco { color: orange; }
.agotado { color: red; }

button {
    padding: 10px;
    background-color: #b48a5a;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

</style>
</head>

<body>

<img src="logo.jpg" class="banner">

<h2>Catálogo</h2>

<!-- BOTONES -->
<div class="categorias">
    <button onclick="mostrar('caballero')">Caballero</button>
    <button onclick="mostrar('dama')">Dama</button>
    <button onclick="mostrar('unisex')">Unisex</button>
    <button onclick="mostrar('ninos')">Niños</button>
</div>

<!-- CABALLERO -->
<div id="caballero" class="contenedor-productos">

<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/16310/16310_1.jpg">
    <h3>FIRST INSTINCT</h3>
    <p>$922</p>
    <p class="disponible">Disponibles: 2</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/16958/16958_1.jpg">
    <h3>FIERCE</h3>
    <p>$1186</p>
    <p class="disponible">Disponibles: 2</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

</div>

<!-- DAMA -->
<div id="dama" class="contenedor-productos" style="display:none;">

<div class="producto">
    <img src="https://m.media-amazon.com/images/I/616qMRxVDtL._AC_UF1000,1000_QL80_.jpg">
    <h3>ARIANA GRANDE CLOUD</h3>
    <p>$2155</p>
    <p class="poco">Disponibles: 1</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

</div>

<!-- UNISEX -->
<div id="unisex" class="contenedor-productos" style="display:none;">

<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/AHP1037/AHP1037_1.jpg">
    <h3>HARAMAIN AMBER OUD ROUGE</h3>
    <p>$1764</p>
    <p class="poco">Disponibles: 1</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

</div>

<!-- NIÑOS -->
<div id="ninos" class="contenedor-productos" style="display:none;">

<div class="producto">
    <img src="https://tiendalafe.com/cdn/shop/files/Disenosintitulo-2025-12-26T154946.817_600x600_crop_center.png">
    <h3>TUBBES CANDY POP</h3>
    <p>$446</p>
    <p class="disponible">Disponibles: 2</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

</div>

<script>
function mostrar(cat) {
    document.getElementById("caballero").style.display = "none";
    document.getElementById("dama").style.display = "none";
    document.getElementById("unisex").style.display = "none";
    document.getElementById("ninos").style.display = "none";

    document.getElementById(cat).style.display = "grid";
}
</script>

</body>
</html>
