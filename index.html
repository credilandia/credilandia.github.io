<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Credilandia</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background-color: #f8f6f3;
    text-align: center;
}

/* HEADER */
.banner {
    width: 100%;
    display: block;
}

/* TEXTO */
.subtitulo {
    margin: 20px;
    color: #555;
}

/* GRID PRODUCTOS */
.contenedor-productos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 20px;
}

/* PRODUCTO */
.producto {
    background: white;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

.producto img {
    width: 100%;
    border-radius: 10px;
}

/* STOCK */
.disponible { color: green; font-weight: bold; }
.poco { color: orange; font-weight: bold; }
.agotado { color: red; font-weight: bold; }

/* BOTÓN */
button {
    padding: 10px;
    background-color: #b48a5a;
    color: white;
    border: none;
    border-radius: 5px;
    margin-top: 10px;
    cursor: pointer;
}

button:hover {
    background-color: black;
}

</style>
</head>

<body>

<img src="logo.jpg" class="banner">

<p class="subtitulo">Perfumería de diseñador y fragancias árabes 100% originales</p>

<hr>

<h2>Catálogo</h2>

<div class="contenedor-productos">

<!-- PRODUCTO 1 -->
<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/16310/16310_1.jpg">
    <h3>ABERCROMBIE & FITCH FIRST INSTINCT</h3>
    <p>$922.00</p>
    <p class="disponible">Disponibles: 2</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

<!-- PRODUCTO 2 -->
<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/16958/16958_1.jpg">
    <h3>ABERCROMBIE & FITCH FIERCE</h3>
    <p>$1,186.00</p>
    <p class="poco">Disponibles: 2</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

<!-- PRODUCTO 3 -->
<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/32205/32205_1.jpg">
    <h3>ADIDAS VICTORY LEAGUE</h3>
    <p>$233.00</p>
    <p class="poco">Disponibles: 4</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

<!-- PRODUCTO 4 -->
<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/07021/07021_1.jpg">
    <h3>SUPREMACY NOT ONLY INTENSE</h3>
    <p>$1,176.00</p>
    <p class="poco">Disponibles: 1</p>
    <button onclick="window.open('https://wa.me/2293749393')">Comprar</button>
</div>

</div>

</body>
</html>
