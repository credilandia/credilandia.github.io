<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Credilandia</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background-color: #f8f6f3;
    text-align: center;
}

.banner {
    width: 100%;
}

.descripcion {
    padding: 15px;
    font-size: 18px;
    color: #333;
    max-width: 800px;
    margin: auto;
}

.categorias {
    margin: 20px;
}

.categorias button {
    margin: 10px;
    padding: 15px 22px;
    background: linear-gradient(135deg, #d4af37, #b48a5a);
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

/* 🔥 NUEVO ORDEN AUTOMÁTICO */
.contenedor-productos {
    column-count: 4;
    column-gap: 20px;
    padding: 20px;
}

.producto {
    display: inline-block;
    width: 100%;
    margin-bottom: 20px;
    background: white;
    padding: 15px;
    border-radius: 15px;
    transition: 0.3s;
}

.producto img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}

/* 🔥 TITULOS DE MARCA BIEN */
.contenedor-productos h2 {
    column-span: all;
    text-align: left;
    margin: 20px 0 10px;
    font-size: 18px;
    color: #b48a5a;
}

button {
    padding: 10px;
    background-color: #b48a5a;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 5px;
}

.resaltado {
    outline: 5px solid red;
    transform: scale(1.1);
    transition: 0.3s;
}

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

.modal-contenido {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
}

.cerrar {
    float: right;
    cursor: pointer;
    font-weight: bold;
}

/* 📱 RESPONSIVE */
@media (max-width: 900px) {
    .contenedor-productos {
        column-count: 2;
    }
}

@media (max-width: 500px) {
    .contenedor-productos {
        column-count: 1;
    }
}

</style>
</head>

<body>

<img src="logo.jpg" class="banner">

<div class="descripcion">
Descubre perfumes originales de diseñador y fragancias árabes.
También contamos con crédito en tienda.
</div>

<h2>Catálogo</h2>

<div class="categorias">
    <button onclick="mostrar('caballero')">Caballero</button>
    <button onclick="mostrar('dama')">Dama</button>
    <button onclick="mostrar('unisex')">Unisex</button>
    <button onclick="mostrar('ninos')">Niños</button>
</div>

<div id="caballero" class="contenedor-productos"></div>
<div id="dama" class="contenedor-productos" style="display:none;"></div>
<div id="unisex" class="contenedor-productos" style="display:none;"></div>
<div id="ninos" class="contenedor-productos" style="display:none;"></div>

<div id="modalCredito" class="modal">
    <div class="modal-contenido">
        <span class="cerrar" onclick="cerrarModal()">X</span>
        <h3>Plazos quincenales</h3>
        <div id="planes"></div>
    </div>
</div>

<script>

// TODO TU JS SE QUEDA IGUAL (NO LO TOQUÉ)

function mostrar(cat) {
    document.getElementById("caballero").style.display = "none";
    document.getElementById("dama").style.display = "none";
    document.getElementById("unisex").style.display = "none";
    document.getElementById("ninos").style.display = "none";

    document.getElementById(cat).style.display = "block";
}

function abrirCredito(precio){
    let p = parseFloat(precio);

    let plan3 = Math.ceil((p + (p * 0.24)) / 3);
    let plan6 = Math.ceil((p + (p * 0.24)) / 6);
    let plan12 = Math.ceil((p + (p * 0.60)) / 12);
    let plan18 = Math.ceil((p + (p * 1.08)) / 18);

    document.getElementById("planes").innerHTML = `
    <p>3 pagos de $${plan3}</p>
    <p>6 pagos de $${plan6}</p>
    <p>12 pagos de $${plan12}</p>
    <p>18 pagos de $${plan18}</p>
    `;

    document.getElementById("modalCredito").style.display = "flex";
}

function cerrarModal(){
    document.getElementById("modalCredito").style.display = "none";
}

function limpiarID(texto){
    return texto
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "-")
        .replace(/-+/g, "-");
}

function resaltarProducto(id){
    let el = document.getElementById(id);
    if(!el) return;

    let categoria = el.getAttribute("data-cat");
    if(categoria){
        mostrar(categoria);
    }

    setTimeout(() => {
        el.scrollIntoView({behavior: "smooth", block: "center"});
        el.classList.add("resaltado");

        setTimeout(() => {
            el.classList.remove("resaltado");
        }, 4000);

    }, 800);
}

fetch('https://raw.githubusercontent.com/credilandia/credilandia.github.io/main/perfumes.csv')
.then(res => res.text())
.then(data => {

    const filas = data.split('\n').slice(1);

    let contenedores = {
        caballero: {},
        dama: {},
        unisex: {},
        ninos: {}
    };

    filas.forEach(fila => {

        const datos = fila.split(',');

        if(datos.length < 9) return;

        let nombre = datos[0]?.trim();
        let categoria = datos[1]?.trim().toLowerCase();
        let precio = datos[2]?.replace(/["$ ]/g, '');
        let stock = parseInt(datos[3]);
        let ml = datos[4]?.trim();
        let tipo = datos[5]?.trim();
        let aroma = datos[6]?.trim();
        let marca = datos[7]?.trim();
        let imagen = datos[8]?.trim();

        if(!nombre || !categoria || !marca) return;

        let idProducto = limpiarID(nombre);

        if(!imagen || imagen === ""){
            imagen = "https://via.placeholder.com/200x200?text=Sin+imagen";
        } else if(!imagen.startsWith('http')){
            imagen = `https://intranet.ufra.com.mx/img/products/catalog/${imagen}/${imagen}_1.jpg`;
        }

        let textoStock = stock === 0 ? "Agotado" : "Disponibles: " + stock;

        let mensaje = encodeURIComponent(
            "Hola quiero este perfume:\n" +
            nombre +
            "\nLink: https://credilandia.github.io/#" + idProducto
        );

        const producto = `
        <div class="producto" id="${idProducto}" data-cat="${categoria}">
            <img src="${imagen}">
            <h3>${nombre}</h3>
            <p>${ml} ml • ${tipo} • ${aroma}</p>
            <p>$${precio}</p>
            <p>${textoStock}</p>

            <button onclick="abrirCredito(${precio})">A crédito</button>

            <a href="https://wa.me/2293749393?text=${mensaje}" target="_blank">
                <button>Comprar</button>
            </a>
        </div>
        `;

        if(!contenedores[categoria][marca]){
            contenedores[categoria][marca] = [];
        }

        contenedores[categoria][marca].push(producto);

    });

    for(let categoria in contenedores){
        let contenedorHTML = document.getElementById(categoria);

        for(let marca in contenedores[categoria]){
            contenedorHTML.innerHTML += `
                <h2>${marca}</h2>
                ${contenedores[categoria][marca].join('')}
            `;
        }
    }

});

</script>

</body>
</html>
