<script>
function mostrar(cat, btn) {
    document.getElementById("caballero").style.display = "none";
    document.getElementById("dama").style.display = "none";
    document.getElementById("unisex").style.display = "none";
    document.getElementById("ninos").style.display = "none";

    document.getElementById(cat).style.display = "grid";

    let botones = document.querySelectorAll('.categorias button');
    botones.forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
}

/* 💳 FUNCIÓN DE CRÉDITO */
function cotizarCredito(nombre, precio) {
    let p = parseFloat(precio);

    let q3 = ((p * 1.24) / 3).toFixed(2);
    let q6 = ((p * 1.24) / 6).toFixed(2);
    let q12 = ((p * 1.60) / 12).toFixed(2);
    let q18 = ((p * 2.08) / 18).toFixed(2);

    alert(
`💳 Cotización para: ${nombre}

🔹 3 pagos de $${q3}
🔹 6 pagos de $${q6}
🔹 12 pagos de $${q12}
🔹 18 pagos de $${q18}`
    );
}

fetch('https://raw.githubusercontent.com/credilandia/credilandia.github.io/main/perfumes.csv')
.then(res => res.text())
.then(data => {

    const filas = data.split('\n').slice(1);

    filas.forEach(fila => {

        const datos = fila.split(',');

        if(datos.length < 8) return;

        let nombre = datos[0]?.trim();
        let categoria = datos[1]?.trim().toLowerCase();
        let precio = datos[2]?.replace(/["$ ]/g, '');
        let stock = parseInt(datos[3]);
        let ml = datos[4]?.trim();
        let tipo = datos[5]?.trim();
        let aroma = datos[6]?.trim();
        let imagen = datos[7]?.trim();

        if(!nombre || !categoria) return;

        // 🔥 limpiar comillas problemáticas en el nombre
        let nombreSeguro = nombre.replace(/['"]/g, "");

        if(!imagen.startsWith('http')){
            imagen = `https://intranet.ufra.com.mx/img/products/catalog/${imagen}/${imagen}_1.jpg`;
        }

        let estado = "disponible";
        let textoStock = "Disponibles: " + stock;

        if(stock === 0){
            estado = "agotado";
            textoStock = "Agotado";
        } else if(stock === 1){
            estado = "poco";
        }

        const producto = `
        <div class="producto">
            <img src="${imagen}">
            <h3>${nombre}</h3>
            <p class="subtitulo">${ml} ml • ${tipo} • ${aroma}</p>
            <p>$${precio}</p>
            <p class="${estado}">${textoStock}</p>

            <a href="https://wa.me/2293749393?text=Hola me interesa el perfume ${encodeURIComponent(nombre)}" target="_blank">
                <button>Comprar</button>
            </a>

            <button onclick="cotizarCredito('${nombreSeguro}', ${precio})">
                💳 Cotizar a crédito
            </button>

        </div>
        `;

        const contenedor = document.getElementById(categoria);

        if(contenedor){
            contenedor.innerHTML += producto;
        }

    });

});
</script>
