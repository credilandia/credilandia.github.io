body {
    margin: 0;
    font-family: Arial;
    background-color: #f8f6f3;
    text-align: center;
}

/* HEADER */
.banner {
    width: 100%;
    display: block;
}

/* TEXTO */
.subtitulo {
    margin: 20px;
    color: #555;
}

/* BOTONES CATEGORÍAS */
.categorias {
    margin: 20px;
}

.categorias button {
    margin: 5px;
    padding: 10px 15px;
    background-color: #b48a5a;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

.categorias button:hover {
    background-color: black;
}

/* GRID PRODUCTOS */
.contenedor-productos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 20px;
}

/* PRODUCTO */
.producto {
    background: white;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

.producto img {
    width: 100%;
    border-radius: 10px;
}
