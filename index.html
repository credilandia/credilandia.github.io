<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Credilandia</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background-color: #f8f6f3;
    text-align: center;
}

.banner {
    width: 100%;
}

/* BOTONES */
.categorias {
    margin: 20px;
}

.categorias button {
    margin: 8px;
    padding: 12px 18px;
    background: linear-gradient(135deg, #d4af37, #b48a5a);
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* GRID */
.contenedor-productos {
    display: none; /* 🔥 CLAVE */
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 20px;
}

.activo {
    display: grid; /* 🔥 SOLO ESTE SE VE */
}

/* PRODUCTO */
.producto {
    background: white;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

.producto img {
    width: 100%;
}

</style>
</head>

<body>

<img src="logo.jpg" class="banner">

<h2>Catálogo</h2>

<!-- BOTONES -->
<div class="categorias">
    <button onclick="mostrar('caballero')">Caballero</button>
    <button onclick="mostrar('dama')">Dama</button>
    <button onclick="mostrar('unisex')">Unisex</button>
    <button onclick="mostrar('ninos')">Niños</button>
</div>

<!-- CABALLERO -->
<div id="caballero" class="contenedor-productos activo">

<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/16310/16310_1.jpg">
    <h3>FIRST INSTINCT</h3>
    <p>$922</p>
</div>

</div>

<!-- DAMA -->
<div id="dama" class="contenedor-productos">

<div class="producto">
    <img src="https://m.media-amazon.com/images/I/616qMRxVDtL._AC_UF1000,1000_QL80_.jpg">
    <h3>ARIANA GRANDE CLOUD</h3>
    <p>$2155</p>
</div>

</div>

<!-- UNISEX -->
<div id="unisex" class="contenedor-productos">

<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/AHP1037/AHP1037_1.jpg">
    <h3>AMBER OUD ROUGE</h3>
    <p>$1764</p>
</div>

</div>

<!-- NIÑOS -->
<div id="ninos" class="contenedor-productos">

<div class="producto">
    <img src="https://tiendalafe.com/cdn/shop/files/Disenosintitulo-2025-12-26T154946.817_600x600_crop_center.png">
    <h3>TUBBES CANDY POP</h3>
    <p>$446</p>
</div>

</div>

<script>
function mostrar(categoria) {
    let secciones = document.querySelectorAll('.contenedor-productos');

    secciones.forEach(sec => {
        sec.classList.remove('activo');
    });

    document.getElementById(categoria).classList.add('activo');
}
</script>

</body>
</html>
