<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Credilandia</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background-color: #f8f6f3;
    text-align: center;
}

.banner {
    width: 100%;
}

/* BOTONES */
.categorias {
    margin: 20px;
}

.categorias button {
    margin: 5px;
    padding: 10px 15px;
    background-color: #b48a5a;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

/* GRID */
.contenedor-productos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 20px;
}

/* PRODUCTO */
.producto {
    background: white;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

.producto img {
    width: 100%;
}

/* STOCK */
.disponible { color: green; }
.poco { color: orange; }
.agotado { color: red; }

button {
    padding: 10px;
    background-color: #b48a5a;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

</style>
</head>

<body>

<img src="logo.jpg" class="banner">

<h2>Catálogo</h2>

<!-- BOTONES -->
<div class="categorias">
    <button onclick="mostrar('caballero')">Caballero</button>
    <button onclick="mostrar('dama')">Dama</button>
    <button onclick="mostrar('unisex')">Unisex</button>
    <button onclick="mostrar('ninos')">Niños</button>
</div>

<!-- CABALLERO -->
<div id="caballero" class="contenedor-productos">

<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/16310/16310_1.jpg">
    <h3>FIRST INSTINCT</h3>
    <p>$922</p>
    <p class="disponible">Disponibles: 2</p>
</div>

<div class="producto">
    <img src="https://intranet.ufra.com.mx/img/products/catalog/16958/16958_1.jpg">
    <h3>FIERCE</h3>
    <p>$1186</p>
    <p class="disponible">Disponibles: 2</p>
</div>

</div>

<!-- DAMA -->
<div id="dama" class="contenedor-productos" style="display:none;">
</div>

<div id="unisex" class="contenedor-productos"
