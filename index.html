<style>

body {
    margin: 0;
    font-family: Arial;
    background-color: #f8f6f3;
    text-align: center;
}

.banner {
    width: 100%;
}

.descripcion {
    padding: 15px;
    font-size: 18px;
    color: #333;
    max-width: 800px;
    margin: auto;
}

.categorias {
    margin: 20px;
}

.categorias button {
    margin: 10px;
    padding: 15px 22px;
    background: linear-gradient(135deg, #d4af37, #b48a5a);
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

/* 🔥 GRID CORREGIDO */
.contenedor-productos {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 20px;
}

/* 🔥 TARJETAS IGUALES */
.producto {
    background: white;
    padding: 15px;
    border-radius: 15px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* 🔥 IMÁGENES ORDENADAS */
.producto img {
    width: 100%;
    height: 200px;
    object-fit: contain;
    margin-bottom: 10px;
}

/* TEXTO MÁS LIMPIO */
.producto h3 {
    font-size: 14px;
    min-height: 40px;
}

.producto p {
    font-size: 13px;
}

/* BOTONES */
button {
    padding: 10px;
    background-color: #b48a5a;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 5px;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

.modal-contenido {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
}

.cerrar {
    float: right;
    cursor: pointer;
    font-weight: bold;
}

/* 📱 RESPONSIVE */
@media (max-width: 1024px) {
    .contenedor-productos {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .contenedor-productos {
        grid-template-columns: 1fr;
    }
}

</style>
